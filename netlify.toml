[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Pin a runtime that has global fetch (Node 18+) for both build and functions.
[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# Map the app's /api/* requests to the matching Netlify Function.
# e.g. /api/team-preview -> /.netlify/functions/team-preview
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback so client-side routing serves index.html for everything else.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
